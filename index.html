<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1220">
  <title>Zenta Business</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="toast" class="toast"></div>

  <section id="authScreen" class="auth-screen">
    <div class="auth-card">
      <div class="brand-mark">Z</div>
      <h1>Zenta Business</h1>
      <p class="muted">Manage your business from one place.</p>

      <div id="phoneStep">
        <label>Phone number</label>
        <div class="phone-row">
          <span class="country">+260</span>
          <input id="phoneInput" type="tel" inputmode="numeric" placeholder="97 123 4567">
        </div>
        <div id="recaptcha-container"></div>
        <button id="sendOtpBtn" class="primary full">Send OTP</button>
        <p class="small muted">Use the number registered with your Firebase Authentication project.</p>
      </div>

      <div id="otpStep" class="hidden">
        <label>Verification code</label>
        <input id="otpInput" type="text" inputmode="numeric" maxlength="6" placeholder="123456">
        <button id="verifyOtpBtn" class="primary full">Verify & Continue</button>
        <button id="backPhoneBtn" class="ghost full">Use another number</button>
      </div>

      <p id="authError" class="error"></p>
    </div>
  </section>

  <section id="appScreen" class="app-shell hidden">
    <aside class="sidebar" id="sidebar">
      <div class="side-brand"><span class="brand-mark small">Z</span><span>Zenta</span></div>
      <nav>
        <button class="nav-item active" data-page="dashboard">⌂ <span>Dashboard</span></button>
        <button class="nav-item" data-page="sales">▣ <span>Sales</span></button>
        <button class="nav-item" data-page="expenses">− <span>Expenses</span></button>
        <button class="nav-item" data-page="stock">▤ <span>Stock</span></button>
        <button class="nav-item" data-page="customers">♙ <span>Customers / Nkongole</span></button>
        <button class="nav-item" data-page="invoices">▧ <span>Invoices</span></button>
        <button class="nav-item" data-page="reports">◫ <span>Reports</span></button>
        <button class="nav-item" data-page="cashflow">⇄ <span>Cash Flow</span></button>
        <button class="nav-item" data-page="settings">⚙ <span>Settings</span></button>
      </nav>
      <button id="logoutBtn" class="logout">↪ Sign out</button>
    </aside>

    <main class="main">
      <header class="topbar">
        <button id="menuBtn" class="icon-btn">☰</button>
        <div>
          <div class="eyebrow" id="pageEyebrow">Business overview</div>
          <h2 id="pageTitle">Dashboard</h2>
        </div>
        <div class="top-actions">
          <span id="businessBadge" class="business-badge">My Business</span>
        </div>
      </header>

      <div id="pageContent" class="content"></div>
    </main>
  </section>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="script.js"></script>
</body>
</html>
